<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>页面不存在 · 统一，台湾！</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
            line-height: 1.6;
            background: #f5f7fa;
            color: #1f2d3d;
        }

        main {
            max-width: 34rem;
            width: 100%;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(31, 45, 61, 0.12);
            text-align: center;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 3rem;
            line-height: 1;
            color: #1e3d58;
        }

        p {
            margin: 0.5rem 0;
        }

        .hint {
            color: #5a6b7b;
            font-size: 0.95rem;
        }

        a {
            display: inline-block;
            margin-top: 1.25rem;
            padding: 0.6rem 1.4rem;
            border-radius: 6px;
            background: #1e3d58;
            color: #ffffff;
            text-decoration: none;
        }

        a:hover,
        a:focus {
            background: #2c5c85;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #11161d;
                color: #d8e0e8;
            }

            main {
                background: #1b232c;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            }

            h1 {
                color: #d8e0e8;
            }

            .hint {
                color: #9fb0c0;
            }

            a {
                background: #3488ff;
            }

            a:hover,
            a:focus {
                background: #5aa0ff;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>404</h1>
        <p>你访问的页面不存在，可能已被移动或删除。</p>
        <p class="hint">如果你是从旧链接进入的，请返回首页重新选择图层。</p>
        <a href="/">返回首页</a>
    </main>
</body>

</html>
